<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<title>{% block title %}Part 107 Ground School{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="{{ 'dark' if dark else '' }}">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <a href="{{ url_for('home') }}" style="text-decoration:none">
        <h1>Part 107 Ground School</h1>
        <div class="tag">FAA prep</div>
      </a>
    </div>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('review') }}">Study list</a>
      <a href="{{ url_for('toggle_theme') }}">{{ 'Light' if dark else 'Dark' }}</a>
      {% if user %}
      <span style="color:var(--ink)">{{ user.username }}</span>
      <form method="post" action="{{ url_for('logout') }}" style="display:inline;margin:0">
        <button type="submit" style="border:none;background:none;padding:0;color:var(--muted);font-family:var(--mono);font-size:13px;cursor:pointer">Sign out</button>
      </form>
      {% else %}
      <a href="{{ url_for('login') }}">Sign in</a>
      {% endif %}
    </nav>
  </header>
  {% block body %}{% endblock %}
  <div class="note">Server-rendered Python app. Progress saves on this server, tied to your browser.</div>
</div>
</body>
</html>
