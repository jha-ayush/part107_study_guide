{% extends "base.html" %}
{% block title %}Sign in - Part 107 Ground School{% endblock %}
{% block body %}
<div class="section-title">Sign in</div>
{% if error %}<div class="explain bad" style="margin-bottom:14px">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('login') }}" class="qcard">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <label class="flabel">Email</label>
  <input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required
         class="field" style="margin-bottom:14px" placeholder="you@example.com">
  <label class="flabel">Password</label>
  <input type="password" name="password" autocomplete="current-password" required
         class="field" style="margin-bottom:18px">
  <button type="submit" class="btn-primary">Sign in</button>
</form>
<div class="center" style="font-size:14px;color:var(--muted)">No account yet? <a href="{{ url_for('register') }}">Create one</a></div>
{% endblock %}
